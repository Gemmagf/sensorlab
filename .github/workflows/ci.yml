name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (CPU-only torch keeps the job under a few minutes)
        run: |
          python -m pip install --upgrade pip wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests scripts app
          ruff format --check src tests scripts app

      - name: Test (pytest)
        run: pytest -v --cov=src/sensorlab --cov-report=term-missing

      - name: Smoke-test the CLI end to end
        run: |
          sensorlab train --fast --n-normal-runs 4 --n-runs-per-fault 2 --fault-run-minutes 180 \
            --window 12 --model-out /tmp/smoke/pipeline.joblib --results-out /tmp/smoke/results.json
          sensorlab info --model /tmp/smoke/pipeline.joblib > /dev/null
          python - <<'PY'
          import json; r = json.load(open("/tmp/smoke/results.json"))
          assert set(r["seeds"]["0"]["detection"]) == {"PCA-T2Q", "IForest", "LSTM-AE"}
          print("smoke ok")
          PY
