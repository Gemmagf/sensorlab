name: Pages

# Publishes the governance dashboard as a static site: trains the reference
# model, exports every dashboard payload to JSON and deploys the folder.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[serve]"
      - name: Train reference model and export the dashboard
        run: |
          sensorlab train --seed 0 --model-out models/pipeline.joblib
          sensorlab export-site --model models/pipeline.joblib --results artifacts/results.json \
            --out site --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
